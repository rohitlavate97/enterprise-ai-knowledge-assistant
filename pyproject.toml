[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "Enterprise AI Knowledge Assistant with FastAPI, Streamlit, LangGraph, and RAG"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pika>=1.3.0", # RabbitMQ client
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "langgraph>=0.2.0",
    "pydantic-ai>=0.0.18", # We pick Pydantic AI for single-agent definitions and LangGraph for multi-agent coordination
    "llama-index>=0.11.0",
    "qdrant-client>=1.10.0",
    "jinja2>=3.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
